name: Deploy to Raspberry Pi

on:
  push:
    tags:
      - 'v*'           # Triggers on tags like v1.0.0, v2.1.3, etc.

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 1. Check out source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 1.1 Check if version already matches tag
      - name: Check if version already matches tag
        id: version_check
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          CURRENT=$(grep -oP '(?<=<Version>)[^<]+' ./ModulesApp/ModulesApp.csproj)
          if [ "$CURRENT" = "$VERSION" ]; then
            echo "already_set=true" >> $GITHUB_OUTPUT
          else
            echo "already_set=false" >> $GITHUB_OUTPUT
          fi

      # 1.2 Set version from tag
      - name: Set version from tag
        if: steps.version_check.outputs.already_set == 'false'
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          sed -i "s|<Version>.*</Version>|<Version>$VERSION</Version>|" ./ModulesApp/ModulesApp.csproj

      # 1.3 Commit version bump to master and move tag to updated commit
      - name: Commit version and move tag to master
        if: steps.version_check.outputs.already_set == 'false'
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ModulesApp/ModulesApp.csproj
          git commit -m "chore: bump version to $VERSION"
          git push origin HEAD:master
          git tag -f "${GITHUB_REF_NAME}"
          git push origin -f "${GITHUB_REF_NAME}"

      # 2. Install .NET SDK
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # 3. Restore dependencies
      - name: Restore dependencies
        run: dotnet restore

      # 4. Build and publish for ARM64 Linux
      - name: Build and publish
        run: |
          dotnet publish ./ModulesApp/ModulesApp.csproj \
            --configuration Release \
            --runtime linux-arm64 \
            --no-self-contained \
            --output ./publish  

      # 4.1 Install EF Core CLI tool (needed to build the migrations bundle)
      - name: Install EF Core tools
        run: dotnet tool install --global dotnet-ef --version 9.0.8

      # 4.2 Build a self-contained migrations bundle for linux-arm64
      - name: Build migrations bundle
        run: |
          dotnet ef migrations bundle \
            --project ./ModulesApp/ModulesApp.csproj \
            --configuration Release \
            --runtime linux-arm64 \
            --self-contained \
            --output ./efbundle \
            --force

      # 5. Set up SSH key from GitHub Secret
      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      # 5.1 Copy the migration bundle to the server
      - name: Copy migration bundle to server
        run: |
          scp ./efbundle \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/tmp/efbundle

      # 5.2 Apply the database migration (runs on the Pi, against the local Postgres)
      #     If this step fails, the workflow stops here and the old service is
      #     never touched, so the previous version keeps running.
      - name: Run database migration
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "chmod +x /tmp/efbundle && /tmp/efbundle --connection '${{ secrets.DB_CONNECTION_STRING }}' && rm -f /tmp/efbundle"

      # 6. Stop the service before deploying
      - name: Stop systemctl service
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "sudo systemctl stop ${{ secrets.SERVICE_NAME }}"

      # 7. Clean deploy directory
      - name: Clean deploy directory
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "rm -rf ${{ secrets.DEPLOY_PATH }}/* && mkdir -p ${{ secrets.DEPLOY_PATH }}"

      # 8. Copy files to server via SCP
      - name: Deploy files to server
        run: |
          scp -r ./publish/* \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.DEPLOY_PATH }}/

      # 8.1 Write appsettings.Production.json
      - name: Write appsettings.Production.json
        run: |
          echo '${{ secrets.APP_SETTINGS }}' > ./appsettings.Production.json
          scp ./appsettings.Production.json \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.DEPLOY_PATH }}/appsettings.Production.json

      # 9. Start the service after deploying
      - name: Start systemctl service
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "sudo systemctl start ${{ secrets.SERVICE_NAME }}"

      # 10. Verify the service is running
      - name: Verify service status
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "sudo systemctl is-active ${{ secrets.SERVICE_NAME }}"